{# Compact header for all pages except index.html #}
<header class="main-header" style="
    margin:0; padding:0;
    position:fixed; top:0; left:0; right:100;
    width:100%;
    z-index:100;
    background:#1D1A39;
    border-radius:0 !important;
    border-bottom:3px solid transparent;
">

    <nav class="nav-container" style="
        width:100%;
        padding:0.8rem 1.5rem;
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:nowrap;
        gap:1rem;
        box-sizing:border-box;
        overflow:hidden;
    ">

        <!-- LOGO -->
        <a href="{{ url_for('index') }}" class="logo-container" style="
            display:flex; align-items:center; gap:0.5em;
            flex-shrink:0;
        ">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="parkingwale Logo"
                 style="width:120px; padding:4px; border-radius:10px;">
        </a>

        <!-- BUTTONS -->
        <div class="nav-actions" style="
            display:flex; align-items:center; gap:1rem;
            flex-shrink:0;
        ">

            {% if current_user and current_user.is_authenticated %}
                
                <span style="color:#E8BCB9; font-weight:500;">Hi, {{ current_user.username }}</span>

                <a href="{{ url_for('user_dashboard') }}"
                   class="btn btn-primary"
                   style="padding:0.5em 1.2em; font-size:1em;">Dashboard</a>

                <a href="{{ url_for('logout') }}"
                   class="btn btn-danger"
                   style="padding:0.5em 1.2em; font-size:1em;">Logout</a>

            {% else %}

                <a href="{{ url_for('login') }}"
                   class="btn btn-primary"
                   style="padding:0.5em 1.2em; font-size:1em;">Login</a>

                <a href="{{ url_for('register') }}"
                   class="btn btn-success"
                   style="padding:0.5em 1.2em; font-size:1em;">Register</a>

            {% endif %}
        </div>

    </nav>
</header>

<!-- Gradient border placed OUTSIDE the fixed header (fixes hidden content issue) -->
<div style="
    position:fixed;
    top:64px;        /* height of your header */
    left:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg, #F39F5A, #D9480F);
    z-index:99;
"></div>

<!-- Page content spacing fix -->
<style>
body {
    margin:0 !important;
    padding-top:70px !important;  /* ensures your content shows below header */
}

@media (max-width: 768px) {
    body { padding-top:120px !important; }

    .nav-container {
        flex-direction: column;
        align-items: flex-start;
        gap:0.8em;
        padding:1em;
    }
}
</style>
